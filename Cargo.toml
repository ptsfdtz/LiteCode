[workspace]
members = [
    "crates/litecode-agent",
    "crates/litecode-core",
    "crates/litecode-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
base64 = "0.22.1"
futures-util = "0.3.31"
rand = "0.9.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = "0.14.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["macros", "process", "rt-multi-thread", "io-util", "sync"] }
